<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MoneyManager</title>
  <meta name="description" content="Suivi de budget, prévision d'épargne et anticipation des impôts.">
  <meta name="theme-color" content="#2a78d6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="view-title">Mois</h1>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Navigation principale">
    <button data-tab="month" class="active"><span class="ic">📅</span>Mois</button>
    <button data-tab="history"><span class="ic">📊</span>Bilan</button>
    <button data-tab="forecast"><span class="ic">🔮</span>Prévisions</button>
    <button data-tab="tax"><span class="ic">🧾</span>Impôts</button>
    <button data-tab="settings"><span class="ic">⚙️</span>Réglages</button>
  </nav>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="tooltip" class="tooltip" role="status" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/version.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/bnp-import.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
